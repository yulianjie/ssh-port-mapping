name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.4.3 --yes --no-progress --allow-downgrade
      - name: Package installer and portable archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-windows.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PortWeave ${{ github.ref_name }}
          files: |
            dist/PortWeave-*-windows-x86_64-Setup.exe
            dist/PortWeave-windows-x86_64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
