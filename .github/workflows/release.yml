name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/PortWeave | Out-Null
          Copy-Item target/release/portweave.exe dist/PortWeave/
          Copy-Item README.md,LICENSE dist/PortWeave/
          Compress-Archive -Path dist/PortWeave -DestinationPath dist/PortWeave-windows-x86_64.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PortWeave-windows-x86_64.zip
          generate_release_notes: true
