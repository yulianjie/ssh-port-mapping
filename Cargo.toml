[package]
name = "portweave"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight desktop manager for SSH local and remote port forwarding"
license = "MIT"
repository = "https://github.com/yulianjie/ssh-port-mapping"
keywords = ["ssh", "port-forwarding", "iced", "desktop", "tunnel"]
categories = ["network-programming", "gui"]

[dependencies]
directories = "6.0.0"
glob = "0.3.3"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "crisp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
