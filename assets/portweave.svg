<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>PortWeave</title>
  <desc>Two interwoven routes connect opposing ports on a midnight blue tile.</desc>
  <defs>
    <linearGradient id="tile" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#203750"/>
      <stop offset="1" stop-color="#0B1628"/>
    </linearGradient>
    <linearGradient id="blue" x1="112" y1="184" x2="400" y2="328" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73CAFF"/>
      <stop offset="1" stop-color="#4C8EFF"/>
    </linearGradient>
    <linearGradient id="mint" x1="112" y1="328" x2="400" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27CBB7"/>
      <stop offset="1" stop-color="#9BF3D5"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" stroke="#A5C7E8" stroke-opacity=".16" stroke-width="4"/>
  <!-- The interrupted blue route makes the central overpass explicit. -->
  <path d="M112 184H160C196 184 213 215 230 234M282 278C299 297 316 328 352 328H400" stroke="url(#blue)" stroke-width="44" stroke-linecap="round"/>
  <path d="M112 328H160C208 328 224 184 352 184H400" stroke="url(#mint)" stroke-width="44" stroke-linecap="round"/>
  <!-- Four open port sockets stay legible without text or tiny details. -->
  <g fill="#122239" stroke-width="18">
    <rect x="82" y="154" width="60" height="60" rx="20" stroke="#73CAFF"/>
    <rect x="370" y="298" width="60" height="60" rx="20" stroke="#4C8EFF"/>
    <rect x="82" y="298" width="60" height="60" rx="20" stroke="#27CBB7"/>
    <rect x="370" y="154" width="60" height="60" rx="20" stroke="#9BF3D5"/>
  </g>
</svg>
